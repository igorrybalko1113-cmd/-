<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" id="metaTheme">
<title>ТМХ · НЭВЗ — Справочник нового сотрудника</title>
<style>
/* ================= ТОКЕНЫ И ТЕМЫ ================= */
:root{
  --light-blue:#68C1ED;
  --dark-blue:#2A5294;
  --grey:#8A96A1;
  --bg:#F2F5F9;
  --card:#FFFFFF;
  --card-2:#F5F8FC;
  --text:#111111;
  --text-2:#55636F;
  --muted:#8A96A1;
  --accent:#2A5294;
  --accent-soft:rgba(104,193,237,.16);
  --separator:rgba(138,150,161,.26);
  --shadow:0 8px 28px rgba(42,82,148,.12);
  --shadow-sm:0 2px 12px rgba(42,82,148,.08);
  --grad:linear-gradient(135deg,#68C1ED 0%,#2A5294 100%);
  --green:#34C759;
  --green-bg:rgba(52,199,89,.14);
  --red:#FF3B30;
  --red-bg:rgba(255,59,48,.12);
  --amber:#FF9F0A;
  --amber-bg:rgba(255,159,10,.14);
  --tabbar:rgba(255,255,255,.78);
  --header:rgba(255,255,255,.82);
  --mark:#FFEFA8;
  --mark-text:#5A4300;
  --chip-bg:#FFFFFF;
  --input-bg:rgba(138,150,161,.14);
}
[data-theme="dark"]{
  --light-blue:#7ED0F7;
  --dark-blue:#5B8FD9;
  --grey:#8C96A0;
  --bg:#0D1117;
  --card:#1C2128;
  --card-2:#232A33;
  --text:#E8EEF5;
  --text-2:#A9B6C2;
  --muted:#8C96A0;
  --accent:#7ED0F7;
  --accent-soft:rgba(126,208,247,.14);
  --separator:rgba(255,255,255,.10);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-sm:0 2px 12px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,#5BC0F0 0%,#3A6CB8 100%);
  --green:#30D158;
  --green-bg:rgba(48,209,88,.16);
  --red:#FF453A;
  --red-bg:rgba(255,69,58,.16);
  --amber:#FFD60A;
  --amber-bg:rgba(255,214,10,.14);
  --tabbar:rgba(20,25,32,.78);
  --header:rgba(13,17,23,.80);
  --mark:rgba(255,214,10,.30);
  --mark-text:#FFE9A3;
  --chip-bg:#1C2128;
  --input-bg:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Brutal Type',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-weight:400;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}
mark{background:var(--mark);color:var(--mark-text);border-radius:4px;padding:0 2px}
::selection{background:var(--light-blue);color:#fff}

/* ================= ШАПКА ================= */
.app-header{
  position:sticky;top:0;z-index:60;
  background:var(--header);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--separator);
  overflow:hidden;
}
.wave-pattern{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.header-inner{
  position:relative;max-width:900px;margin:0 auto;
  padding:14px 16px 14px;display:flex;align-items:center;gap:12px;
}
.logo-mark{flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(42,82,148,.28))}
.brand-text{min-width:0;flex:1}
.brand-title{
  font-size:24px;font-weight:800;line-height:1.05;color:var(--accent);
  letter-spacing:.04em;
}
.brand-sub{
  font-size:12.5px;font-weight:500;color:var(--grey);
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.theme-toggle{
  flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:var(--card);border:1px solid var(--separator);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .3s;
  position:relative;overflow:hidden;
}
.theme-toggle:active{transform:scale(.9)}
.theme-toggle svg{width:22px;height:22px;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.theme-toggle .ico-moon{position:absolute;transform:translateY(140%) rotate(-40deg);opacity:0;color:var(--light-blue)}
.theme-toggle .ico-sun{color:var(--amber)}
[data-theme="dark"] .theme-toggle .ico-moon{transform:translateY(0) rotate(0);opacity:1}
[data-theme="dark"] .theme-toggle .ico-sun{transform:translateY(-140%) rotate(40deg);opacity:0}

/* ================= КОНТЕЙНЕР ================= */
main{max-width:900px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom));position:relative}
.panel{display:none}
.panel.active{display:block;animation:panelIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.page-title{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:4px 2px 2px}
.page-sub{font-size:14px;color:var(--muted);margin:0 2px 16px;font-weight:500}

/* ================= ПОИСК (iOS) ================= */
.searchbar{
  display:flex;align-items:center;gap:8px;
  background:var(--input-bg);
  border-radius:14px;padding:0 12px;height:48px;
  margin-bottom:12px;border:1px solid transparent;
  transition:border-color .2s,background .2s;
}
.searchbar:focus-within{border-color:var(--light-blue);background:var(--card)}
.searchbar svg{width:19px;height:19px;color:var(--muted);flex:0 0 auto}
.searchbar input{
  flex:1;min-width:0;border:0;background:none;outline:none;
  font-size:16px;font-weight:500;color:var(--text);height:100%;
}
.searchbar input::placeholder{color:var(--muted);font-weight:500}
.search-clear{
  width:24px;height:24px;border-radius:50%;background:var(--muted);
  color:#fff;display:none;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:14px;line-height:1;transition:transform .15s;
}
.search-clear.show{display:flex}
.search-clear:active{transform:scale(.85)}

/* ================= ЧИПСЫ ================= */
.chips-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;flex:1;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:38px;padding:0 16px;border-radius:19px;
  background:var(--chip-bg);border:1px solid var(--separator);
  color:var(--text-2);font-size:14px;font-weight:600;white-space:nowrap;
  box-shadow:var(--shadow-sm);transition:transform .15s,color .2s,background .2s;
}
.chip:active{transform:scale(.94)}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(42,82,148,.30)}
.expand-all{
  flex:0 0 auto;height:38px;padding:0 14px;border-radius:19px;
  border:1px solid var(--separator);background:var(--card);color:var(--accent);
  font-size:13px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .15s;
}
.expand-all:active{transform:scale(.94)}
.search-meta{font-size:13px;color:var(--muted);font-weight:600;margin:0 4px 12px}

/* ================= КАРТОЧКИ-АККОРДЕОНЫ ================= */
.acc{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow-sm);
  margin-bottom:12px;overflow:hidden;border:1px solid var(--separator);
  transition:box-shadow .25s,transform .25s;
}
.acc.open{box-shadow:var(--shadow)}
.acc-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:14px 16px;min-height:64px;text-align:left;transition:background .2s;
}
.acc-head:active{background:var(--card-2)}
.acc-icon{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.acc-icon svg{width:22px;height:22px}
.acc-head-text{flex:1;min-width:0}
.acc-title{font-size:17px;font-weight:700;line-height:1.25;color:var(--text)}
.acc-cat{
  display:inline-block;margin-top:5px;font-size:11.5px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
  padding:2px 9px;border-radius:9px;letter-spacing:.01em;
}
.acc-right{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.acc-count{font-size:12.5px;font-weight:700;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .35s cubic-bezier(.34,1.2,.64,1)}
.acc.open .chev{transform:rotate(90deg);color:var(--accent)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.3,.9,.3,1)}
.acc.open .acc-body{grid-template-rows:1fr}
.acc-body>div{overflow:hidden}
.acc-inner{padding:2px 16px 18px;border-top:1px solid var(--separator)}

.item{padding-top:16px}
.item-title{font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.item-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--light-blue);flex:0 0 auto}
.item-text{margin:0 0 8px;color:var(--text-2);font-size:14.8px;line-height:1.55;font-weight:400}
.item-list{margin:0;padding:0;list-style:none}
.item-list li{
  position:relative;padding-left:20px;margin-bottom:8px;
  color:var(--text-2);font-size:14.8px;line-height:1.5;
}
.item-list li::before{
  content:"";position:absolute;left:4px;top:8px;width:7px;height:7px;border-radius:2px;
  background:var(--grad);
}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin:4px 0 4px}
.stat{background:var(--card-2);border-radius:13px;padding:11px 10px;border:1px solid var(--separator)}
.stat-num{font-size:21px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.stat-lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.3}
.kv-list{margin:2px 0 0}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--separator)}
.kv:last-child{border-bottom:0}
.kv-k{flex:0 0 42%;font-size:14px;font-weight:700;color:var(--text);line-height:1.4}
.kv-v{flex:1;font-size:14px;color:var(--text-2);line-height:1.45;font-weight:500}
.steps{margin:2px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{
  position:relative;padding:0 0 12px 40px;counter-increment:st;
  font-size:14.6px;color:var(--text-2);line-height:1.5;
}
.steps li::before{
  content:counter(st);position:absolute;left:0;top:-1px;
  width:28px;height:28px;border-radius:9px;background:var(--grad);
  color:#fff;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(42,82,148,.28);
}
.note{
  margin-top:10px;padding:12px 14px;border-radius:13px;
  font-size:14.2px;line-height:1.5;font-weight:500;
  background:var(--accent-soft);border-left:4px solid var(--light-blue);color:var(--text);
}
.note.warn{background:var(--red-bg);border-left-color:var(--red);font-weight:700}
.note.tip{background:var(--green-bg);border-left-color:var(--green)}
.note.brand{background:var(--grad);border-left:0;color:#fff;font-weight:800;font-size:15px;letter-spacing:.01em}
.empty{
  text-align:center;padding:52px 20px;background:var(--card);border-radius:16px;
  border:1px dashed var(--separator);box-shadow:var(--shadow-sm);
}
.empty svg{width:52px;height:52px;color:var(--muted);margin-bottom:12px}
.empty h3{font-size:18px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin:0;font-weight:500}
.foot{margin:22px 4px 0;text-align:center;font-size:12px;color:var(--muted);font-weight:500}

/* ================= ВИКТОРИНА ================= */
.quiz-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 18px;border:1px solid var(--separator)}
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.q-counter{font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.q-score{font-size:13px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:5px 11px;border-radius:12px}
.progress-track{height:8px;border-radius:5px;background:var(--input-bg);overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;border-radius:5px;background:var(--grad);width:0;transition:width .5s cubic-bezier(.3,.9,.3,1)}
.q-text{font-size:20px;font-weight:700;line-height:1.35;letter-spacing:-.02em;margin-bottom:18px}
.answers{display:flex;flex-direction:column;gap:10px}
.answer{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:56px;padding:13px 14px;border-radius:15px;
  background:var(--card-2);border:1.6px solid var(--separator);
  font-size:15.5px;font-weight:600;color:var(--text);line-height:1.35;
  transition:transform .14s,border-color .22s,background .22s,opacity .22s;
}
.answer:active:not(.locked){transform:scale(.975);border-color:var(--light-blue)}
.answer .letter{
  flex:0 0 auto;width:30px;height:30px;border-radius:10px;
  background:var(--card);border:1px solid var(--separator);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:var(--accent);transition:all .22s;
}
.answer.correct{background:var(--green-bg);border-color:var(--green);color:var(--text)}
.answer.correct .letter{background:var(--green);border-color:var(--green);color:#fff}
.answer.wrong{background:var(--red-bg);border-color:var(--red);color:var(--text)}
.answer.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
.answer.dim{opacity:.45}
.answer.locked{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.answer.wrong{animation:shake .4s}
.explain{margin-top:16px;border-radius:15px;padding:15px;animation:slideUp .38s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.explain.ok{background:var(--green-bg);border:1px solid rgba(52,199,89,.35)}
.explain.bad{background:var(--red-bg);border:1px solid rgba(255,59,48,.32)}
.explain-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:6px}
.explain.ok .explain-head{color:var(--green)}
.explain.bad .explain-head{color:var(--red)}
.explain-head svg{width:20px;height:20px}
.explain-text{font-size:14.3px;line-height:1.55;color:var(--text-2);font-weight:500;margin:0}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:52px;border-radius:15px;
  font-size:16.5px;font-weight:700;letter-spacing:-.01em;
  transition:transform .15s,box-shadow .2s,opacity .2s;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(42,82,148,.30)}
.btn-ghost{background:var(--card-2);color:var(--accent);border:1px solid var(--separator)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,59,48,.3)}
.btn.mt{margin-top:14px}
.start-hero{text-align:center;padding:8px 4px 4px}
.start-emoji{width:84px;height:84px;border-radius:26px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 14px 30px rgba(42,82,148,.32)}
.start-emoji svg{width:44px;height:44px;color:#fff}
.start-hero h2{font-size:24px;margin-bottom:8px;letter-spacing:-.03em}
.start-hero p{color:var(--text-2);font-size:15px;margin:0 auto 18px;max-width:420px;line-height:1.55;font-weight:500}
.feature-list{display:flex;flex-direction:column;gap:9px;margin:0 0 18px;text-align:left}
.feature{display:flex;gap:11px;align-items:flex-start;background:var(--card-2);border:1px solid var(--separator);border-radius:13px;padding:11px 13px}
.feature svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto;margin-top:1px}
.feature span{font-size:14px;color:var(--text-2);font-weight:500;line-height:1.45}
.feature b{color:var(--text);font-weight:700}

.result-wrap{text-align:center;padding:6px 2px}
.ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 14px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:var(--input-bg)}
.ring-fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.9,.3,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring-sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}
.result-msg{font-size:17px;font-weight:700;margin:6px 0 4px}
.result-note{font-size:14.5px;color:var(--text-2);margin:0 auto 18px;max-width:400px;line-height:1.5;font-weight:500}
.result-pills{display:flex;gap:9px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.pill{background:var(--card-2);border:1px solid var(--separator);border-radius:13px;padding:10px 15px;min-width:104px}
.pill b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.pill span{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ================= СТАТИСТИКА ================= */
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--card);border-radius:16px;padding:15px 12px;box-shadow:var(--shadow-sm);border:1px solid var(--separator);text-align:center}
.metric-val{font-size:26px;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.metric-lbl{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:5px;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
.chart-card{background:var(--card);border-radius:18px;padding:18px 14px 14px;box-shadow:var(--shadow-sm);border:1px solid var(--separator);margin-bottom:14px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px;padding:0 4px}
.chart-head h3{font-size:16.5px;font-weight:700}
.chart-head span{font-size:12px;color:var(--muted);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:7px;height:196px;padding:0 2px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;gap:6px}
.bar-val{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:-.01em;height:14px;line-height:14px}
.bar-track{flex:1;width:100%;background:var(--card-2);border-radius:9px;position:relative;overflow:hidden;border:1px solid var(--separator)}
.bar-fill{position:absolute;left:0;bottom:0;width:100%;height:0;border-radius:8px;background:var(--grad);transition:height .9s cubic-bezier(.3,.9,.3,1)}
.bar-date{font-size:9.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.25;height:24px}
.avg-line{position:absolute;left:0;right:0;border-top:1.6px dashed var(--light-blue);opacity:.75;pointer-events:none}
.hist{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);border:1px solid var(--separator);overflow:hidden;margin-bottom:14px}
.hist-head{padding:14px 16px;font-size:16px;font-weight:700;border-bottom:1px solid var(--separator)}
.hist-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--separator)}
.hist-row:last-child{border-bottom:0}
.hist-num{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hist-info{flex:1;min-width:0}
.hist-date{font-size:14px;font-weight:600;color:var(--text)}
.hist-mini{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.hist-pct{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.hist-bar{height:5px;border-radius:3px;background:var(--input-bg);overflow:hidden;margin-top:6px}
.hist-bar i{display:block;height:100%;background:var(--grad);border-radius:3px}

/* ================= TAB BAR (iOS) ================= */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--tabbar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--separator);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-inner{max-width:900px;margin:0 auto;display:flex}
.tab{
  flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.01em;
  transition:color .2s,transform .16s;
}
.tab svg{width:25px;height:25px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tab:active{transform:scale(.93)}
.tab.active{color:var(--accent)}
.tab.active svg{transform:translateY(-1px) scale(1.06)}

@media (max-width:560px){
  .page-title{font-size:26px}
  .brand-title{font-size:21px}
  .brand-sub{font-size:11.5px}
  .kv{flex-direction:column;gap:3px}
  .kv-k{flex:none;font-size:13.5px}
  .metric-grid{grid-template-columns:repeat(3,1fr);gap:7px}
  .metric{padding:12px 6px}
  .metric-val{font-size:21px}
  .metric-lbl{font-size:10px}
  .q-text{font-size:18.5px}
  .bar-date{font-size:8.5px}
  .stats-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
}

   4. СОСТОЯНИЕ И ХРАНИЛИЩЕ
========================================================== */
const QUIZ_LEN = 10;
const STATS_KEY = 'nevz_stats_v1';
const THEME_KEY = 'nevz_theme_v1';
const state = {q:'', cat:'all', open:new Set(), theme:'light', allExpanded:false};

function loadStats(){ try{ const raw = localStorage.getItem(STATS_KEY); const arr = raw?JSON.parse(raw):[]; return Array.isArray(arr)?arr:[]; }catch(err){ return []; } }
function saveStats(arr){ try{ localStorage.setItem(STATS_KEY, JSON.stringify(arr.slice(-10))); }catch(err){} }

/* ---------- ТЕМА ---------- */
function applyTheme(t){
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  const mt = document.getElementById('metaTheme');
  if(mt) mt.setAttribute('content', t==='dark' ? '#0D1117' : '#FFFFFF');
  try{ localStorage.setItem(THEME_KEY, t); }catch(err){}
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(err){}
  if(!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) saved = 'dark';
  applyTheme(saved === 'dark' ? 'dark' : 'light');
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  applyTheme(state.theme === 'dark' ? 'light' : 'dark');
});

/* ==========================================================
   5. УТИЛИТЫ
========================================================== */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function hl(s,q){
  const e = esc(s);
  if(!q) return e;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  try{ return e.replace(new RegExp('('+safe+')','gi'), '<mark>$1</mark>'); }catch(err){ return e; }
}
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function plural(n, forms){
  const n10 = n%10, n100 = n%100;
  if(n10===1 && n100!==11) return forms[0];
  if(n10>=2 && n10<=4 && (n100<10||n100>=20)) return forms[1];
  return forms[2];
}
function fmtDate(ts){
  const d = new Date(ts);
  const p = function(v){ return v<10 ? '0'+v : ''+v; };
  return {short:p(d.getDate())+'.'+p(d.getMonth()+1), time:p(d.getHours())+':'+p(d.getMinutes()), full:p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' · '+p(d.getHours())+':'+p(d.getMinutes())};
}

/* ==========================================================
   6. ВКЛАДКИ
========================================================== */
const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
const panels = {guide:document.getElementById('panel-guide'), quiz:document.getElementById('panel-quiz'), stats:document.getElementById('panel-stats')};
function setTab(name){
  tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
  Object.keys(panels).forEach(function(k){ panels[k].classList.toggle('active', k===name); });
  window.scrollTo({top:0, behavior:'smooth'});
  if(name==='stats') renderStats();
}
tabs.forEach(function(t){ t.addEventListener('click', function(){ setTab(t.dataset.tab); }); });

/* ==========================================================
   7. СПРАВОЧНИК: РЕНДЕР
========================================================== */
const cats = ['all'].concat(guideData.map(function(s){ return s.cat; }).filter(function(v,i,a){ return a.indexOf(v)===i; }));
const chipsEl = document.getElementById('chips');
function renderChips(){
  chipsEl.innerHTML = cats.map(function(c){
    const label = c==='all' ? 'Все разделы' : c;
    return '<button class="chip'+(state.cat===c?' active':'')+'" data-cat="'+esc(c)+'">'+esc(label)+'</button>';
  }).join('');
}
chipsEl.addEventListener('click', function(e){
  const b = e.target.closest('.chip');
  if(!b) return;
  state.cat = b.dataset.cat;
  renderChips();
  renderGuide();
});

function itemText(it){
  let s = (it.t||'')+' '+(it.text||'')+' '+(it.note||'');
  (it.list||[]).forEach(function(x){ s += ' '+x; });
  (it.kv||[]).forEach(function(r){ s += ' '+r[0]+' '+r[1]; });
  (it.stats||[]).forEach(function(r){ s += ' '+r[0]+' '+r[1]; });
  (it.steps||[]).forEach(function(x){ s += ' '+x; });
  return s.toLowerCase();
}

function renderItem(it, q){
  let h = '<div class="item">';
  if(it.t) h += '<div class="item-title">'+hl(it.t,q)+'</div>';
  if(it.text) h += '<p class="item-text">'+hl(it.text,q)+'</p>';
  if(it.stats) h += '<div class="stats-grid">'+it.stats.map(function(s){
    return '<div class="stat"><div class="stat-num">'+hl(s[0],q)+'</div><div class="stat-lbl">'+hl(s[1],q)+'</div></div>';
  }).join('')+'</div>';
  if(it.list) h += '<ul class="item-list">'+it.list.map(function(l){ return '<li>'+hl(l,q)+'</li>'; }).join('')+'</ul>';
  if(it.kv) h += '<div class="kv-list">'+it.kv.map(function(r){
    return '<div class="kv"><span class="kv-k">'+hl(r[0],q)+'</span><span class="kv-v">'+hl(r[1],q)+'</span></div>';
  }).join('')+'</div>';
  if(it.steps) h += '<ol class="steps">'+it.steps.map(function(s){ return '<li>'+hl(s,q)+'</li>'; }).join('')+'</ol>';
  if(it.note) h += '<div class="note '+(it.noteType||'')+'">'+hl(it.note,q)+'</div>';
  h += '</div>';
  return h;
}

function renderGuide(){
  const qRaw = state.q.trim();
  const q = qRaw.toLowerCase();
  const listEl = document.getElementById('guideList');
  const metaEl = document.getElementById('searchMeta');
  let html = '', secCount = 0, itemFound = 0;

  guideData.forEach(function(sec){
    if(state.cat!=='all' && sec.cat!==state.cat) return;
    let items = sec.items;
    if(q){
      const titleHit = sec.title.toLowerCase().indexOf(q) !== -1;
      items = sec.items.filter(function(it){ return titleHit || itemText(it).indexOf(q) !== -1; });
      if(!items.length) return;
    }
    secCount++;
    itemFound += items.length;
    const open = q ? true : state.open.has(sec.id);
    html += '<article class="acc'+(open?' open':'')+'" data-id="'+sec.id+'">'
      + '<button class="acc-head" type="button" aria-expanded="'+(open?'true':'false')+'">'
      + '<span class="acc-icon">'+icon(sec.icon)+'</span>'
      + '<span class="acc-head-text"><span class="acc-title">'+hl(sec.title,qRaw)+'</span><span class="acc-cat">'+esc(sec.cat)+'</span></span>'
      + '<span class="acc-right"><span class="acc-count">'+items.length+' '+plural(items.length,['блок','блока','блоков'])+'</span>'
      + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
      + '</span></button>'
      + '<div class="acc-body"><div><div class="acc-inner">'
      + items.map(function(it){ return renderItem(it, qRaw); }).join('')
      + '</div></div></div></article>';
  });

  if(!secCount){
    html = '<div class="empty">'+icon('search')+'<h3>Ничего не найдено</h3><p>Попробуйте изменить запрос или выберите другую категорию.<br>Например: «пропуск», «5С», «отпуск», «20-78», «Ермак».</p></div>';
  }

  listEl.innerHTML = html;

  if(q){
    metaEl.textContent = 'По запросу «'+qRaw+'» найдено '+secCount+' '+plural(secCount,['раздел','раздела','разделов'])+' · '+itemFound+' '+plural(itemFound,['блок','блока','блоков']);
    metaEl.style.display = 'block';
  } else if(state.cat!=='all'){
    metaEl.textContent = 'Категория: '+state.cat+' · '+secCount+' '+plural(secCount,['раздел','раздела','разделов']);
    metaEl.style.display = 'block';
  } else {
    metaEl.textContent = 'Всего разделов: '+guideData.length+' · вопросов в викторине: '+allQuestions.length;
    metaEl.style.display = 'block';
  }
  updateExpandBtn();
}

document.getElementById('guideList').addEventListener('click', function(e){
  const head = e.target.closest('.acc-head');
  if(!head) return;
  const acc = head.parentElement;
  const id = acc.dataset.id;
  const nowOpen = !acc.classList.contains('open');
  acc.classList.toggle('open', nowOpen);
  head.setAttribute('aria-expanded', nowOpen?'true':'false');
  if(nowOpen) state.open.add(id); else state.open.delete(id);
  updateExpandBtn();
});

const expandBtn = document.getElementById('expandAll');
function updateExpandBtn(){
  const total = document.querySelectorAll('#guideList .acc').length;
  const opened = document.querySelectorAll('#guideList .acc.open').length;
  state.allExpanded = total>0 && opened===total;
  expandBtn.textContent = state.allExpanded ? 'Свернуть всё' : 'Развернуть всё';
}
expandBtn.addEventListener('click', function(){
  const accs = Array.prototype.slice.call(document.querySelectorAll('#guideList .acc'));
  const expand = !state.allExpanded;
  accs.forEach(function(a){
    a.classList.toggle('open', expand);
    const h = a.querySelector('.acc-head');
    if(h) h.setAttribute('aria-expanded', expand?'true':'false');
    if(expand) state.open.add(a.dataset.id); else state.open.delete(a.dataset.id);
  });
  updateExpandBtn();
});

const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', function(){
  state.q = searchInput.value;
  searchClear.classList.toggle('show', state.q.length>0);
  renderGuide();
});
searchInput.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ searchInput.value=''; state.q=''; searchClear.classList.remove('show'); renderGuide(); searchInput.blur(); }
});
searchClear.addEventListener('click', function(){
  searchInput.value=''; state.q=''; searchClear.classList.remove('show'); renderGuide(); searchInput.focus();
});

/* ==========================================================
   8. ВИКТОРИНА
========================================================== */
const quizBody = document.getElementById('quizBody');
let quiz = {list:[], idx:0, score:0, locked:true};

function renderStart(){
  quizBody.innerHTML =
  '<div class="quiz-card"><div class="start-hero">'
  + '<div class="start-emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.1"/><path d="M12 17.6h.01"/></svg></div>'
  + '<h2>Проверьте знания справочника</h2>'
  + '<p>База содержит <b>'+allQuestions.length+' вопросов</b> по всем разделам справочника нового сотрудника НЭВЗа. Каждая попытка — это '+QUIZ_LEN+' случайных вопросов с подробными пояснениями.</p>'
  + '<div class="feature-list">'
  + '<div class="feature">'+icon('refresh')+'<span><b>Новые вопросы каждый раз.</b> База перемешивается алгоритмом Фишера — Йетса, варианты ответов тоже.</span></div>'
  + '<div class="feature">'+icon('bulb')+'<span><b>Обучающий режим.</b> После ответа появляется пояснение со ссылкой на факт из справочника.</span></div>'
  + '<div class="feature">'+icon('chart')+'<span><b>Прогресс сохраняется.</b> Результат автоматически попадает во вкладку «Статистика».</span></div>'
  + '</div>'
  + '<button class="btn btn-primary" id="startQuiz">Начать викторину</button>'
  + '</div></div>';
  document.getElementById('startQuiz').addEventListener('click', startQuiz);
}

function startQuiz(){
  const picked = shuffleArr(allQuestions).slice(0, QUIZ_LEN);
  quiz.list = picked.map(function(o){
    const opts = o.a.map(function(txt,i){ return {text:txt, ok:(i===o.c)}; });
    const sh = shuffleArr(opts);
    return {q:o.q, e:o.e, opts:sh, ci:sh.findIndex(function(x){ return x.ok; })};
  });
  quiz.idx = 0; quiz.score = 0;
  renderQuestion();
}

const LETTERS = ['А','Б','В','Г'];

function renderQuestion(){
  const item = quiz.list[quiz.idx];
  const num = quiz.idx+1;
  const pct = Math.round((quiz.idx)/QUIZ_LEN*100);
  let h = '<div class="quiz-card">'
    + '<div class="quiz-top"><span class="q-counter">Вопрос '+num+' из '+QUIZ_LEN+'</span><span class="q-score">Верно: '+quiz.score+'</span></div>'
    + '<div class="progress-track"><div class="progress-fill" id="pfill" style="width:'+pct+'%"></div></div>'
    + '<div class="q-text">'+esc(item.q)+'</div>'
    + '<div class="answers" id="answers">'
    + item.opts.map(function(o,i){
        return '<button class="answer" data-i="'+i+'"><span class="letter">'+LETTERS[i]+'</span><span>'+esc(o.text)+'</span></button>';
      }).join('')
    + '</div>'
    + '<div id="explainSlot"></div>'
    + '</div>';
  quizBody.innerHTML = h;
  requestAnimationFrame(function(){
    const pf = document.getElementById('pfill');
    if(pf) pf.style.width = Math.round((num-1)/QUIZ_LEN*100)+'%';
  });
  document.getElementById('answers').addEventListener('click', onAnswer);
  quiz.locked = false;
}

function onAnswer(e){
  if(quiz.locked) return;
  const btn = e.target.closest('.answer');
  if(!btn) return;
  quiz.locked = true;
  const chosen = parseInt(btn.dataset.i,10);
  const item = quiz.list[quiz.idx];
  const isRight = chosen === item.ci;
  if(isRight) quiz.score++;

  const btns = Array.prototype.slice.call(document.querySelectorAll('#answers .answer'));
  btns.forEach(function(b,i){
    b.classList.add('locked');
    if(i===item.ci) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const pf = document.getElementById('pfill');
  if(pf) pf.style.width = Math.round((quiz.idx+1)/QUIZ_LEN*100)+'%';
  const scoreEl = document.querySelector('.q-score');
  if(scoreEl) scoreEl.textContent = 'Верно: '+quiz.score;

  const last = quiz.idx === QUIZ_LEN-1;
  const slot = document.getElementById('explainSlot');
  slot.innerHTML = '<div class="explain '+(isRight?'ok':'bad')+'">'
    + '<div class="explain-head">'+(isRight?icon('check'):icon('cross'))+(isRight?'Верно!':'Неверно')+'</div>'
    + '<p class="explain-text">'+esc(item.e)+'</p>'
    + '</div>'
    + '<button class="btn btn-primary mt" id="nextBtn">'+(last?'Показать результат':'Следующий вопрос')+'</button>';
  document.getElementById('nextBtn').addEventListener('click', function(){
    if(last) finishQuiz();
    else { quiz.idx++; renderQuestion(); }
  });
  slot.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function finishQuiz(){
  const pct = Math.round(quiz.score/QUIZ_LEN*100);
  const stats = loadStats();
  stats.push({p:pct, ok:quiz.score, total:QUIZ_LEN, d:Date.now()});
  saveStats(stats.slice(-10));

  let msg, note;
  if(pct>=90){ msg='Отличный результат!'; note='Вы уверенно ориентируетесь в справочнике и готовы к работе в команде НЭВЗа.'; }
  else if(pct>=70){ msg='Хороший результат!'; note='База знаний solid — повторите разделы, где были ошибки, и доведите результат до максимума.'; }
  else if(pct>=50){ msg='Неплохо, но есть куда расти'; note='Загляните в разделы «Правила безопасности», «Трудовой распорядок» и «Производственная система» — там много важных деталей.'; }
  else { msg='Стоит повторить справочник'; note='Пройдитесь по разделам во вкладке «Справочник», а затем запустите викторину заново: вопросы будут другими.'; }

  const C = 2*Math.PI*58;
  const wrong = QUIZ_LEN - quiz.score;
  quizBody.innerHTML = '<div class="quiz-card"><div class="result-wrap">'
    + '<div class="ring-wrap"><svg width="180" height="180" viewBox="0 0 180 180">'
    + '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#68C1ED"/><stop offset="1" stop-color="#2A5294"/></linearGradient></defs>'
    + '<circle class="ring-bg" cx="90" cy="90" r="58" fill="none" stroke-width="15"/>'
    + '<circle class="ring-fg" id="ringFg" cx="90" cy="90" r="58" fill="none" stroke-width="15" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'"/>'
    + '</svg><div class="ring-label"><div class="ring-pct" id="ringPct">0%</div><div class="ring-sub">результат</div></div></div>'
    + '<div class="result-msg">'+esc(msg)+'</div>'
    + '<p class="result-note">'+esc(note)+'</p>'
    + '<div class="result-pills">'
    + '<div class="pill"><b>'+quiz.score+'</b><span>Верных</span></div>'
    + '<div class="pill"><b>'+wrong+'</b><span>Ошибок</span></div>'
    + '<div class="pill"><b>'+QUIZ_LEN+'</b><span>Вопросов</span></div>'
    + '</div>'
    + '<button class="btn btn-primary" id="restartQuiz">'+icon('refresh')+'Пройти заново (новые вопросы)</button>'
    + '<button class="btn btn-ghost mt" id="toStats">Посмотреть статистику</button>'
    + '</div></div>';

  requestAnimationFrame(function(){
    const ring = document.getElementById('ringFg');
    if(ring) ring.style.strokeDashoffset = (C - C*pct/100).toFixed(1);
    const lbl = document.getElementById('ringPct');
    if(!lbl) return;
    const start = performance.now(), dur = 1000;
    (function tick(now){
      const t = Math.min(1,(now-start)/dur);
      const eased = 1 - Math.pow(1-t,3);
      lbl.textContent = Math.round(pct*eased)+'%';
      if(t<1) requestAnimationFrame(tick);
    })(start);
  });

  document.getElementById('restartQuiz').addEventListener('click', startQuiz);
  document.getElementById('toStats').addEventListener('click', function(){ setTab('stats'); });
}

/* ==========================================================
   9. СТАТИСТИКА
========================================================== */
const statsBody = document.getElementById('statsBody');
let confirmReset = false, resetTimer = null;

function renderStats(){
  const data = loadStats();
  if(!data.length){
    statsBody.innerHTML = '<div class="empty">'+icon('chart')+'<h3>Пока нет результатов</h3><p>Пройдите викторину — результаты 10 последних попыток сохранятся здесь и будут отображаться на диаграмме.</p>'
      + '<button class="btn btn-primary mt" id="goQuiz" style="max-width:340px;margin:18px auto 0">Перейти к викторине</button></div>';
    const gq = document.getElementById('goQuiz');
    if(gq) gq.addEventListener('click', function(){ setTab('quiz'); });
    return;
  }

  const arr = data.slice(-10);
  const avg = Math.round(arr.reduce(function(s,x){ return s+x.p; },0)/arr.length);
  const best = Math.max.apply(null, arr.map(function(x){ return x.p; }));
  const lastD = fmtDate(arr[arr.length-1].d);

  let h = '<div class="metric-grid">'
    + '<div class="metric"><div class="metric-val">'+avg+'%</div><div class="metric-lbl">Средний балл</div></div>'
    + '<div class="metric"><div class="metric-val">'+best+'%</div><div class="metric-lbl">Лучший результат</div></div>'
    + '<div class="metric"><div class="metric-val">'+arr.length+'</div><div class="metric-lbl">Попыток</div></div>'
    + '</div>';

  h += '<div class="chart-card"><div class="chart-head"><h3>Динамика результатов</h3><span>последняя попытка: '+lastD.full+'</span></div>'
    + '<div class="chart" id="chart" style="position:relative">';
  arr.forEach(function(x){
    const d = fmtDate(x.d);
    h += '<div class="bar-col"><div class="bar-val">'+x.p+'%</div>'
      + '<div class="bar-track"><div class="bar-fill" data-h="'+x.p+'"></div></div>'
      + '<div class="bar-date">'+d.short+'<br>'+d.time+'</div></div>';
  });
  h += '<div class="avg-line" id="avgLine" style="bottom:calc('+(avg*0.74)+'% + 30px)"></div>';
  h += '</div></div>';

  h += '<div class="hist"><div class="hist-head">История попыток</div>';
  arr.slice().reverse().forEach(function(x,i){
    const d = fmtDate(x.d);
    h += '<div class="hist-row"><div class="hist-num">'+(arr.length-i)+'</div>'
      + '<div class="hist-info"><div class="hist-date">'+d.full+'</div>'
      + '<div class="hist-mini">Верных ответов: '+x.ok+' из '+x.total+'</div>'
      + '<div class="hist-bar"><i style="width:'+x.p+'%"></i></div></div>'
      + '<div class="hist-pct">'+x.p+'%</div></div>';
  });
  h += '</div>';

  h += '<button class="btn '+(confirmReset?'btn-danger':'btn-ghost')+'" id="resetStats">'
    + (confirmReset?'Точно сбросить статистику?':'Сбросить статистику')+'</button>';

  statsBody.innerHTML = h;

  requestAnimationFrame(function(){
    const fills = document.querySelectorAll('#chart .bar-fill');
    fills.forEach(function(f){ f.style.height = f.dataset.h+'%'; });
  });

  document.getElementById('resetStats').addEventListener('click', function(){
    if(!confirmReset){
      confirmReset = true;
      renderStats();
      resetTimer = setTimeout(function(){ confirmReset=false; renderStats(); }, 3500);
      return;
    }
    clearTimeout(resetTimer);
    confirmReset = false;
    try{ localStorage.removeItem(STATS_KEY); }catch(err){}
    renderStats();
  });
}

/* ==========================================================
   10. СТАРТ
========================================================== */
renderChips();
renderGuide();
renderStart();
renderStats();
</script>
</body>
</html>
